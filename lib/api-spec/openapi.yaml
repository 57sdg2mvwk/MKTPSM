openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Private authentication
  - name: panel
    description: Private marketing panel
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: Get current authenticated user
      responses:
        "200":
          description: Authenticated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
        "401":
          description: Not authenticated
        "503":
          description: Catalog temporarily unavailable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Sign in to the private panel
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Authenticated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
        "401":
          description: Invalid credentials
  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: End the current session
      responses:
        "204":
          description: Session ended
  /panel/dashboard:
    get:
      operationId: getDashboard
      tags: [panel]
      summary: Get panel dashboard summary
      responses:
        "200":
          description: Dashboard data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dashboard"
        "401":
          description: Not authenticated
  /panel/services:
    get:
      operationId: getServices
      tags: [panel]
      summary: Get public-facing service catalog
      responses:
        "200":
          description: Service catalog
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Service"
        "401":
          description: Not authenticated
        "503":
          description: Catalog temporarily unavailable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /panel/orders:
    get:
      operationId: getOrders
      tags: [panel]
      summary: Get all customer orders
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Order"
        "401":
          description: Not authenticated
    post:
      operationId: createOrder
      tags: [panel]
      summary: Create a new marketing order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderInput"
      responses:
        "201":
          description: Order created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "200":
          description: Existing idempotent order replayed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "202":
          description: Order reservation is pending provider verification
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          description: Invalid order
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Not authenticated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "402":
          description: Monthly credit is insufficient
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: Existing request is pending or rejected
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "502":
          description: Provider could not accept the order
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "503":
          description: Service pricing or monthly credit is unavailable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /panel/orders/status:
    post:
      operationId: syncOrderStatus
      tags: [panel]
      summary: Sync order status from service provider
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderActionInput"
      responses:
        "200":
          description: Updated order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "400":
          description: Invalid request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: Order not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: Order reservation is pending provider verification
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "502":
          description: Provider sync unavailable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /panel/orders/refill:
    post:
      operationId: refillOrder
      tags: [panel]
      summary: Request a refill for an eligible order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderActionInput"
      responses:
        "200":
          description: Updated order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          description: Refill unavailable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Not authenticated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: Order not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: Order reservation is pending provider verification
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "502":
          description: Provider refill unavailable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /panel/orders/reconcile:
    post:
      operationId: reconcileOrderReservation
      tags: [panel]
      summary: Resolve a provider order reservation pending verification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderReconciliationInput"
      responses:
        "200":
          description: Reservation reconciled
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
        "400":
          description: Invalid reconciliation request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Not authenticated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: Order not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    CurrentUser:
      type: object
      properties:
        id: { type: string }
        email: { type: string }
      required: [id, email]
    LoginInput:
      type: object
      properties:
        email: { type: string }
        password: { type: string, minLength: 1 }
      required: [email, password]
    Dashboard:
      type: object
      properties:
        activeOrders: { type: number }
        completedOrders: { type: number }
        totalOrders: { type: number }
        needsAttention: { type: number }
        deliveredQuantity: { type: ["number", "null"] }
        remainingQuantity: { type: ["number", "null"] }
        metricsPendingOrders: { type: number }
        recentOrders:
          type: array
          items: { $ref: "#/components/schemas/Order" }
        lastSyncAt: { type: ["string", "null"] }
        credit: { $ref: "#/components/schemas/CreditSummary" }
      required: [activeOrders, completedOrders, totalOrders, needsAttention, deliveredQuantity, remainingQuantity, metricsPendingOrders, recentOrders, lastSyncAt, credit]
    CreditSummary:
      type: object
      properties:
        allowanceUsd: { type: number }
        spentUsd: { type: number }
        availableUsd: { type: number }
        periodStartedAt: { type: string }
        resetsAt: { type: string }
      required: [allowanceUsd, spentUsd, availableUsd, periodStartedAt, resetsAt]
    Service:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        platform: { type: string }
        contentType: { type: string }
        description: { type: string }
        minQuantity: { type: number }
        maxQuantity: { type: number }
        supportsRefill: { type: boolean }
        estimatedTime: { type: string }
        pricePerThousandUsd: { type: ["number", "null"] }
        orderCount: { type: number }
        requestedUnits: { type: number }
        completionRate: { type: ["number", "null"] }
        medianDurationMinutes: { type: ["number", "null"] }
        medianFirstUpdateMinutes: { type: ["number", "null"] }
        isDataSufficient: { type: boolean }
        tags:
          type: array
          items: { type: string }
      required: [id, name, platform, contentType, description, minQuantity, maxQuantity, supportsRefill, estimatedTime, pricePerThousandUsd, orderCount, requestedUnits, completionRate, medianDurationMinutes, medianFirstUpdateMinutes, isDataSufficient, tags]
    Order:
      type: object
      properties:
        id: { type: string }
        serviceId: { type: string }
        serviceName: { type: string }
        platform: { type: string }
        contentType: { type: string }
        link: { type: string }
        quantity: { type: number }
        status: { type: string }
        progress: { type: number }
        startCount: { type: ["number", "null"] }
        remains: { type: ["number", "null"] }
        delivered: { type: ["number", "null"] }
        createdAt: { type: string }
        lastSyncedAt: { type: ["string", "null"] }
        elapsed: { type: string }
        refillAvailable: { type: boolean }
        costUsd: { type: ["number", "null"] }
        durationMinutes: { type: ["number", "null"] }
        needsReconciliation: { type: boolean }
      required: [id, serviceId, serviceName, platform, contentType, link, quantity, status, progress, startCount, remains, delivered, createdAt, lastSyncedAt, elapsed, refillAvailable, costUsd, durationMinutes, needsReconciliation]
    OrderInput:
      type: object
      properties:
        serviceId: { type: string, minLength: 1 }
        link: { type: string }
        quantity: { type: number, minimum: 1 }
        requestId: { type: string, minLength: 8 }
      required: [serviceId, link, quantity, requestId]
    OrderActionInput:
      type: object
      properties:
        orderId: { type: string, minLength: 1 }
      required: [orderId]
    OrderReconciliationInput:
      type: object
      properties:
        orderId: { type: string, minLength: 1 }
        resolution: { type: string, enum: [attach, release] }
        providerOrderId: { type: string, minLength: 1 }
      required: [orderId, resolution]
    ErrorResponse:
      type: object
      properties:
        error: { type: string }
      required: [error]

